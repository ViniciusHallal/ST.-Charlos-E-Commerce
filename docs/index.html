<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia St. Charlos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Principal -->
    <header>
        <div class="nav-content">
            <button class="logo" onclick="navigate('home')">ST. CHARLOS <span>+</span></button>
            <button class="btn-menu-mobile" id="btn-menu-mobile" aria-label="Abrir menu">☰</button>
            <nav class="menu-links" id="menu-links">
                <button class="link-nav" onclick="navigate('produtos')">Produtos</button>
                <button class="link-nav" onclick="navigate('pedidos')">Meus Pedidos</button>
                <button class="link-nav" id="link-conta" onclick="navigate('login')">Entrar / Cadastrar</button>
                <button class="link-nav" onclick="handleLogout()">Sair</button>
                <button class="cart-icon" onclick="toggleCart(true)" aria-label="Abrir carrinho">
                    <div class="cart-badge" id="cart-count">0</div>
                    🛒
                </button>
            </nav>
        </div>
    </header>

    <!-- Sidebar do Carrinho -->
    <div id="cart-sidebar" class="cart-overlay hidden">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h2>Seu Carrinho</h2>
                <button class="close-cart" onclick="toggleCart(false)" aria-label="Fechar carrinho">✖</button>
            </div>
            <div class="cart-items" id="cart-items-container">
                <p class="empty-state">O carrinho está vazio.</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-price">R$ 0,00</span>
                </div>
                <button class="btn-checkout" id="btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Container Principal -->
    <main class="container">

        <!-- ================= PÁGINA: HOME ================= -->
        <section id="page-home">
            <div class="banner">
                <h2>Bem-vindo à St. Charlos</h2>
                <p>Ofertas exclusivas para cuidar da sua saúde e beleza.</p>
            </div>
            <h2 class="section-title">Recomendações em Destaque</h2>
            <div class="grid-produtos" id="grid-destaques"></div>
        </section>

        <!-- ================= PÁGINA: TODOS OS PRODUTOS ================= -->
        <section id="page-produtos" class="hidden">
            <h2 class="section-title">Todos os Produtos</h2>
            <input
                type="search"
                id="busca-produtos"
                class="busca-produtos"
                placeholder="Buscar por nome do produto..."
                aria-label="Buscar produtos"
            >
            <div id="produtos-por-tipo"></div>
        </section>

        <!-- ================= PÁGINA: MEUS PEDIDOS ================= -->
        <section id="page-pedidos" class="hidden">
            <h2 class="section-title">Meus Pedidos</h2>
            <div id="pedidos-container"></div>
        </section>

        <!-- ================= PÁGINA: LOGIN ================= -->
        <section id="page-login" class="hidden">
            <div class="login-box">
                <h2 style="text-align: center; color: var(--st-blue); margin-bottom: 20px;">Acesso Restrito</h2>
                <p class="form-erro hidden" id="login-erro"></p>
                <form id="form-login">
                    <div class="input-group">
                        <label for="login-email">E-mail</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="input-group">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" minlength="6" required>
                    </div>
                    <button type="submit" class="btn-login">Entrar</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                        Ainda não tem conta?
                        <button type="button" class="link-botao" onclick="navigate('cadastro')">Cadastre-se</button>
                    </p>
                </form>
            </div>
        </section>

        <!-- ================= PÁGINA: CADASTRO ================= -->
        <section id="page-cadastro" class="hidden">
            <div class="login-box">
                <h2 style="text-align: center; color: var(--st-blue); margin-bottom: 20px;">Criar Conta</h2>
                <p class="form-erro hidden" id="cadastro-erro"></p>
                <form id="form-cadastro">
                    <div class="input-group">
                        <label for="cadastro-nome">Nome completo</label>
                        <input type="text" id="cadastro-nome" required>
                    </div>
                    <div class="input-group">
                        <label for="cadastro-email">E-mail</label>
                        <input type="email" id="cadastro-email" required>
                    </div>
                    <div class="input-group">
                        <label for="cadastro-senha">Senha</label>
                        <input type="password" id="cadastro-senha" minlength="6" required>
                    </div>
                    <div class="input-group">
                        <label for="cadastro-confirmar-senha">Confirmar senha</label>
                        <input type="password" id="cadastro-confirmar-senha" minlength="6" required>
                    </div>
                    <button type="submit" class="btn-login">Cadastrar</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                        Já tem conta?
                        <button type="button" class="link-botao" onclick="navigate('login')">Entrar</button>
                    </p>
                </form>
            </div>
        </section>

    </main>

    <div id="toast-container" aria-live="polite"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
